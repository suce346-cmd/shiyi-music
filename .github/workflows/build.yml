name: Build and Release

on:
  push:
    branches: [main]
    # F6一步：v* tag 推送触发 Release 构建（与 main 分支构建共用 test 门禁 + build 矩阵）
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # B5：测试门禁——测试不过不构建、不产出工件
  test:
    # O-6：test 矩阵补 windows（build 已产出 windows 工件，门禁此前只跑 macOS，Windows 回归裸奔）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test -- --run

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend (Tauri 编译宏要求 dist/ 存在)
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: test
    strategy:
      matrix:
        include:
          # macos-13（Intel）已被 GitHub 退役——v0.4.1 的 macos-x64 构建曾因此无限排队；
          # Intel 产物改用 macos-15-intel（现役 x86_64 镜像）
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (macOS)
        if: matrix.os != 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.target }}

      # F5：产物非空校验——bundle 失败（如 Windows 无 nsis 产物）时显式失败，不上传空目录
      - name: Verify bundle artifacts
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then BUNDLE_DIR="src-tauri/target/release/bundle"; fi
          echo "=== bundle contents ==="
          find "$BUNDLE_DIR" -type f | head -20
          if [ -z "$(find "$BUNDLE_DIR" -type f -print -quit)" ]; then
            echo "::error::bundle 目录为空，打包失败"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: shiyi-music-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            src-tauri/target/release/bundle/

  # F6一步：tag 推送时把三平台产物汇总发布到 GitHub Release（draft 由维护者手动发布）
  # F6决策（2026-09-06）：不买 Apple 账号（无签名/notarization）、Windows EV 后置、
  # 先验证 Release 流程本身。updater 运行时（需签名密钥）暂不接入。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: ./artifacts/**/*
