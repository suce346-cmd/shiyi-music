[package]
name = "suno-prompt-generator"
version = "0.3.0"
description = "Suno Prompt Generator — desktop app for generating Suno AI music prompts"
authors = ["shiyi"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "suno_prompt_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
futures-util = "0.3"
keyring = "3"

[profile.release]
# 生产包优化：剥离符号 + LTO + 压缩（产物更小、启动更快）
strip = true
lto = true
codegen-units = 1
# 必须保持 unwind（默认值）：orchestrator.rs 的 spawn 隔离层依赖 JoinError 捕获 panic，
# 设 panic="abort" 会让 release 版任何 panic 直接杀进程闪退（B2 修复，勿回退）
# panic = "abort"
